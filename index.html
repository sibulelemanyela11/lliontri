<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLIONTRI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#dff3ff;color:#43291f}
header{padding:20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:800;letter-spacing:4px}
.cart{background:#43291f;color:#fff;padding:10px 16px;border:none;border-radius:999px}
.hero{text-align:center;padding:50px 20px}
.hero h1{font-size:42px}
.hero p{margin-top:10px;opacity:.7}
.section{padding:20px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.product{background:#fffaf4;border-radius:20px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.img{height:150px;background:#bfe5fa;display:flex;align-items:center;justify-content:center;font-size:40px}
.info{padding:15px}
.price{font-weight:bold;margin:10px 0}
button{cursor:pointer}
.add{width:100%;padding:12px;border:none;background:#43291f;color:white;border-radius:12px}
.error{background:#ffe5e5;color:#8b0000;padding:15px;border-radius:12px}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>

<header>
<div class="logo">LLIONTRI</div>
<button class="cart" onclick="checkout()">Cart <span id="count">0</span></button>
</header>

<section class="hero">
<h1>Your Local Marketplace.</h1>
<p>Shop businesses through WhatsApp.</p>
</section>

<section class="section">
<h2>Featured</h2>

<div class="products" id="products">
Loading products...
</div>
</section>

<script>
const SUPABASE_URL="https://ataruosnvbwhvdctshxv.supabase.co";
const SUPABASE_KEY="sb_publishable_vzE6bS-KlTgvne2ZVAg7kQ_RaR7KgbT";

const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let cart=[];

async function loadProducts(){

const box=document.getElementById("products");

const {data,error}=await supabase
.from("products")
.select("*");

if(error){
box.innerHTML='<div class="error">Connection failed.</div>';
console.log(error);
return;
}

if(!data.length){
box.innerHTML='<div class="error">No products found.</div>';
return;
}

box.innerHTML="";

data.forEach(product=>{

box.innerHTML+=`
<div class="product">
<div class="img">🛍️</div>
<div class="info">
<h3>${product.name}</h3>
<div class="price">R${product.price}</div>
<button class="add" onclick="addToCart('${product.name}',${product.price})">Add to cart</button>
</div>
</div>
`;

});

}

function addToCart(name,price){
cart.push({name,price});
document.getElementById("count").innerText=cart.length;
}

function checkout(){

if(!cart.length){
alert("Cart is empty");
return;
}

let text="LLIONTRI Order%0A%0A";
let total=0;

cart.forEach(item=>{
text+=`• ${item.name} - R${item.price}%0A`;
total+=item.price;
});

text+=`%0ATotal: R${total}`;

window.open(`https://wa.me/?text=${text}`,"_blank");

}

loadProducts();
</script>

</body>
</html>
